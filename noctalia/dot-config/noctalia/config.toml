        [lockscreen_widgets.widget.lockscreen-widget-0000000000000003.settings]
        background = false
        background_color = "primary"
        color = "on_surface"
        format = "{:%Y-%m-%d}"

[notification]
background_opacity = 0.59999999999999998
enable_daemon = true
history_retention_hours = 72
offset_y = 0
position = "top_center"

[osd]
background_opacity = 0.59999999999999998
enabled = true
offset_y = 36
position = "bottom_center"

[plugins]
enabled = []

[shell]
font_family = "Ubuntu Nerd Font"
polkit_agent = true

    [shell.launcher]
    layout = "simple"

        [shell.launcher.providers.windows]
        global = false

    [shell.panel]
    control_center_placement = "floating"
    floating_layer = "top"
    floating_offset = 0
    open_near_click_control_center = true
    open_near_click_session = true
    session_placement = "floating"
    transparency_mode = "glass"

[theme]
builtin = "Tokyo-Night"
community_palette = "Oxocarbon"
custom_palette = "breeze_custom"
mode = "dark"
pure_black_dark = false
source = "builtin"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "qt" ]

[wallpaper.default]
path = "/home/amir/Pictures/Wallpapers/nasa-space-3840x2160-15925.jpg"

[wallpaper.last]
path = "/home/amir/Pictures/Wallpapers/nasa-space-3840x2160-15925.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/amir/Pictures/Wallpapers/nasa-space-3840x2160-15925.jpg"

[widget.active_window]
title_scroll = "on_hover"

[widget.audio_visualizer]
color_2 = "secondary"

[widget.clipboard]
enabled = false

[widget.clock]
format = "{:%a %e %b %H:%M}"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
show_label = false
vpn_status = "both"

[widget.privacy]
hide_inactive = true

[widget.sysmon]
enabled = false

[widget.workspaces]
active_pill_size = 1.6000000000000001
capsule_radius = "auto"
empty_color = "#505050"
focused_color = "#80a0ff"
occupied_color = "#808080"
show_labels = false
