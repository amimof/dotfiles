[bar.default]
background_opacity = 0
capsule = true
capsule_fill = "surface"
capsule_opacity = 0.64999998547136784
capsule_padding = 8
capsule_radius = 12
capsule_thickness = 0.69999998807907104
center = [ "privacy", "media" ]
enabled = true
end = [ "sysmon", "tray", "clipboard", "bluetooth", "network", "volume", "battery", "notifications", "clock", "session" ]
font_family = "Ubuntu Nerd Font Propo"
margin_ends = -8
radius = 0
shadow = false
start = [ "workspaces", "active_window" ]
thickness = 42

[brightness]
enable_ddcutil = true

[calendar]
enabled = true

[control_center]
sidebar = "none"

    [control_center.calendar]
    show_week_numbers = true

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
enabled = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 1

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 120.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 140.0

[keybinds]
down = [ "Down", "Ctrl+n" ]
up = [ "Up", "Ctrl+p" ]

[location]
address = "Varberg, Sweden"
auto_locate = false

[lockscreen]
enabled = true
transition = [ "diamond", "disc", "fade", "golden", "honeycomb", "melt", "pixel", "stripes", "vortex", "wipe", "zoom" ]

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-login-box@DP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 256.0
    cx = 712.0
    cy = 752.0
    output = "eDP-1"
    placement_height = 960.0
    placement_width = 1440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "on_primary"
        background_opacity = 0.0
        background_radius = 12.0
        center_password_text = true
        input_opacity = 0.70000000000000007
        input_radius = 12.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = false
        show_media = true
        show_password_reveal = false
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 48.0
    box_width = 112.0
    cx = 720.0
    cy = 312.0
    output = "eDP-1"
    placement_height = 960.0
    placement_width = 1440.0
    rotation = 0.0
    type = "weather"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 96.0
    box_width = 336.0
    cx = 720.0
    cy = 187.0
    output = "eDP-1"
    placement_height = 960.0
    placement_width = 1440.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        background_opacity = 0.80000000000000004
        clock_style = "digital"
        font_family = ""
        format = "{:%H:%M }"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 32.0
