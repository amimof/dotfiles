$lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = test $(hostname) = "amir-pc" || systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
}

# Dim monitor after 1 minute
listener {
		timeout = 60
		on-timeout = brightnessctl -s set -P 10%
		on-resume = brightnessctl -r
}

# Lock session after 2 minutes
listener {
    timeout = 120 
    on-timeout = loginctl lock-session
}

# Power off monitors after 5 minutes
listener {
    timeout = 300
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}

# Sleep after 30 minutes
listener {
	timeout = 1800
	on-timeout = systemctl sleep
}
